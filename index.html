<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Layout Assignment</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1>My Responsive Webpage</h1>
    </header>

    <!-- Navigation -->
    <nav class="nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <!-- Main Layout (Grid) -->
    <main class="main-layout">
      <!-- Content Area -->
      <section class="content">
        <h2>Welcome</h2>
        <p>
          This section demonstrates the main content of the webpage using CSS
          Grid for layout.
        </p>

        <div class="card-container">
          <div class="card">Card 1</div>
          <div class="card">Card 2</div>
          <div class="card">Card 3</div>
        </div>
      </section>

      <!-- Sidebar -->
      <aside class="sidebar">
        <h3>Sidebar</h3>
        <p>This is the sidebar with additional information.</p>
      </aside>
    </main>
  </body>
</html>
